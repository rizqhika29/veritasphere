name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: contract — lint + direct tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install genvm linter
        run: python -m pip install genvm-linter
      - name: Lint contract
        run: python -c "from genvm_linter.cli import main; import sys; sys.exit(main() or 0)" check contracts/veritasphere.py
      - name: Install test deps
        run: python -m pip install genlayer-test pytest
      - name: Direct-mode tests (mocked web/LLM — no network)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/direct/ -q

  frontend:
    name: frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # Live studionet suites (integration/money-flow/studionet) are opt-in:
      # they cost real consensus time + GEN and need network access.
